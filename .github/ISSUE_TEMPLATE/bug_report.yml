name: Bug report
description: Report a reproducible contract, validation, or documentation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use public or synthetic material only. Do not include credentials, private task history, personal data, internal paths, or non-public logs.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest synthetic steps or fixture that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: v0.2.1
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification evidence
      description: Include test names or sanitized output. Never paste secrets or private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm this report contains only public or synthetic material.
          required: true
